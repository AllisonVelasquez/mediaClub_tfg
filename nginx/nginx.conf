server {
    listen 80;
    index index.php index.html;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /storage/ {
        alias /usr/share/nginx/laravel_public/storage;
        access_log off;
        expires max;
    }

    location /api/ {
        # Reenvía todo lo que empiece con /api al backend Laravel
        proxy_pass http://back:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~ \.php$ {
        fastcgi_pass back:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /usr/share/nginx/laravel_public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
