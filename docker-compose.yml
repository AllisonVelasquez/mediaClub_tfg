services:
  back:
    build:
      context: ./mediaclub_laravel
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - laravel_storage:/var/www/storage/app/public
    networks:
      - web
    depends_on:
      - db
      
  front:
    build:
      context: ./mediaclub_frontend
    container_name: react_app
    restart: "no"
    networks:
      - web

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - laravel_Storage:/usr/share/nginx/html/storage
    networks:
      - web
    depends_on:
      - app
      - front

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: always
    env_file:
      - .docker.env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    env_file:
      - .docker.env
    networks:
      - web

volumes:
  db_data:
volumes:
  laravel_storage:

networks:
  web:
    driver: bridge

